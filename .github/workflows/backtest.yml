name: 🤖 Shank Toys Backtest Automático
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: |
          python -c "
          from streamlit_app import run_backtest
          run_backtest()
          "
      - uses: actions/upload-artifact@v4
        with:
          name: shank-toys-results
          path: outputs/
